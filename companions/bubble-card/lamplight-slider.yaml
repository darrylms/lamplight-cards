lamplight-slider:
  name: Lamplight slider
  version: '1.1'
  description: >-
    The brightness slider skin for a lamplight-light row. It makes the card transparent, sets a 48px
    track that starts 46px from the left, beside the icon, and fills the track with the colour
    that lamplight-light gives in --lamplight-light-fill. Without lamplight-light, it uses
    bubble-card's own light colour. Use it on a button card with button_type slider.
  code: |
    ha-card {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: none !important;
      border: none !important;
      box-shadow: none !important;
    }
    .bubble-button-container {
      background: transparent !important;
      border-radius: 14px !important;
    }
    .bubble-button-card-container {
      height: 48px !important;
      background: transparent !important;
    }
    .bubble-range-slider {
      left: 46px !important;
      right: 0 !important;
      width: auto !important;
      border-radius: 14px !important;
    }
    .bubble-button-background {
      left: 46px !important;
      right: 0 !important;
      width: auto !important;
      background: rgba(255,255,255,0.07) !important;
      opacity: 1 !important;
      border-radius: 14px !important;
    }
    .bubble-range-fill {
      background: var(--lamplight-light-fill, var(--bubble-slider-fill-color, rgba(255,255,255,0.13))) !important;
      opacity: 1 !important;
    }
    .bubble-main-icon-container {
      width: 34px !important;
      height: 34px !important;
      margin-left: 2px !important;
    }
    .bubble-icon {
      color: rgba(255,255,255,0.80) !important;
      line-height: 0 !important;
    }
    .bubble-name {
      display: none !important;
    }
    .bubble-state {
      display: none !important;
    }
  is_global: false
